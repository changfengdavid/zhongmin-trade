<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中旻门户 · 后台管理</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <!-- 登录遮罩 -->
  <div id="login" class="login-overlay">
    <div class="login-box">
      <h2>中旻门户 · 后台管理</h2>
      <p class="muted">请输入管理员密码</p>
      <input type="password" id="pwd" placeholder="管理员密码" />
      <button class="btn" id="login-btn">登 录</button>
      <p class="err" id="login-err"></p>
      <p class="hint">默认密码 admin123，登录后请尽快在「修改密码」中修改。</p>
    </div>
  </div>

  <!-- 主框架 -->
  <div id="app" class="admin" style="display:none">
    <aside class="sidebar">
      <div class="side-brand">中旻门户<br><small>后台管理</small></div>
      <nav id="side-nav"></nav>
      <div class="side-foot">
        <button class="btn-sm danger" id="logout-btn">退出登录</button>
      </div>
    </aside>
    <main class="admin-main">
      <header class="admin-top">
        <h1 id="page-title">公司信息</h1>
        <div class="top-actions">
          <a href="/" target="_blank" class="btn-sm">预览网站 ↗</a>
          <button class="btn" id="save-btn">保存全部更改</button>
        </div>
      </header>
      <div id="admin-content" class="admin-content"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/admin/js/admin.js"></script>
</body>
</html>
